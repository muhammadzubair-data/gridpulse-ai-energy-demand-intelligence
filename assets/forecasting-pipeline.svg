<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Recursive 24-hour forecasting and day-ahead backtest">
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#041026"/><stop offset="1" stop-color="#0A2A44"/></linearGradient></defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<text x="40" y="46" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#22D3EE">FORECASTING PIPELINE</text>
<text x="40" y="72" font-family="Arial,sans-serif" font-size="15" fill="#BFD4E6">Every input is either observed before the origin, a calendar value, an explicit temperature assumption, or the model's own earlier prediction.</text>
